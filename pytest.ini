# pytest configuration for database integrity testing
[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    --strict-markers
    --verbose
    --tb=short
    --disable-warnings
markers =
    database_integrity: Database integrity tests
    cross_database: Cross-database consistency tests
    referential_integrity: Referential integrity tests
    data_consistency: Data consistency validation tests
    orphaned_records: Orphaned records detection tests
    constraint_validation: Data constraint validation tests
    data_freshness: Data freshness and staleness tests
    slow: Slow running tests
    integration: Integration tests requiring live databases

# Test configuration
filterwarnings =
    ignore::UserWarning
    ignore::DeprecationWarning

# Minimum version requirements
minversion = 6.0